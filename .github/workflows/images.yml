# Builds the responsive image derivatives and commits them back.
#
# Why: the site's images are rendered straight out of public/ rather than
# through astro:assets, so scripts/optimize-images.mjs is what produces the
# AVIF/WebP sources that <picture> points at. Shir edits through the GitHub web
# editor and has no way to run it. This does it for her - she uploads a photo,
# and a minute later the derivatives are in the repository and deployed.
#
# The window between her commit and this one is safe and needs no coordination:
# the manifest records a digest of every source, so src/lib/images.ts declines
# to serve derivatives that no longer match and the page falls back to the
# original. New or replaced images look right immediately; they are merely
# unoptimised until this run lands.
name: images

on:
  push:
    branches: [master]
    paths:
      - 'public/img/**'
      - 'src/content/images.toml'
      - 'src/content/recommendations.toml'
      - 'scripts/optimize-images.mjs'
      # A push made with GITHUB_TOKEN cannot start a workflow run, so this
      # job's own commit is already incapable of retriggering it. The exclusion
      # is here so that stays true if the token is ever swapped for a PAT.
      - '!public/img/_opt/**'
  workflow_dispatch:

permissions:
  contents: write

# Two uploads in quick succession would otherwise race to push. Let the later
# one wait rather than cancel: every push must be processed, not just the last.
concurrency:
  group: images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run images

      # Build too: a malformed images.toml or a screenshot path that points at
      # nothing should fail here, loudly, rather than be committed and break the
      # deploy. It costs seconds and the dependencies are already installed.
      - run: pnpm run build

      - name: Commit derivatives
        run: |
          if [ -z "$(git status --porcelain public/img/_opt)" ]; then
            echo "No derivative changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/_opt
          git commit -m "chore: rebuild image derivatives"
          git push
