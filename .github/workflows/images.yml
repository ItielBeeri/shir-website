# Builds the responsive image derivatives and commits them back, so an owner
# uploading through the GitHub web editor never has to run anything.
#
# The window between their commit and this one needs no coordination: the
# manifest carries a digest of every source, so src/lib/images.ts declines
# mismatched derivatives and the page falls back to the original - correct
# immediately, merely unoptimised until this run lands.
name: images

on:
  push:
    branches: [master]
    paths:
      - 'public/img/**'
      - 'src/content/images.toml'
      - 'src/content/recommendations.toml'
      - 'scripts/optimize-images.mjs'
      # Redundant under GITHUB_TOKEN, whose pushes cannot trigger a run - kept
      # so this job's own commit still cannot retrigger it under a PAT.
      - '!public/img/_opt/**'
  workflow_dispatch:

permissions:
  contents: write

# Queue rather than cancel: every push must be processed, not just the last.
concurrency:
  group: images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run images

      # A malformed manifest or a dead screenshot path should fail here rather
      # than be committed and break the deploy.
      - run: pnpm run build

      - name: Commit derivatives
        run: |
          if [ -z "$(git status --porcelain public/img/_opt)" ]; then
            echo "No derivative changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/_opt
          git commit -m "chore: rebuild image derivatives"
          git push
