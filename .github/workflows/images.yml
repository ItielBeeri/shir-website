# Builds the responsive image derivatives and the video renditions, and
# commits them back, so an owner uploading through the GitHub web editor or
# the CMS never has to run anything.
#
# The window between their commit and this one needs no coordination: the
# manifests carry a digest of every source, so src/lib/images.ts and
# src/lib/videos.ts decline mismatched derivatives and the page falls back to
# the original - correct immediately, merely unoptimised until this run lands.
name: images

on:
  push:
    branches: [master]
    paths:
      - 'public/img/**'
      - 'public/video/**'
      - 'src/content/images.toml'
      - 'src/content/videos.toml'
      - 'src/content/recommendations.toml'
      - 'scripts/optimize-images.mjs'
      - 'scripts/optimize-videos.mjs'
      # Redundant under GITHUB_TOKEN, whose pushes cannot trigger a run - kept
      # so this job's own commit still cannot retrigger it under a PAT.
      - '!public/img/_opt/**'
      - '!public/video/_opt/**'
  workflow_dispatch:

permissions:
  contents: write

# Queue rather than cancel: every push must be processed, not just the last.
concurrency:
  group: images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run images

      # ffmpeg only when a video needs encoding: the check reads the manifest
      # and the sources and encodes nothing, so an image push stays quick.
      - name: Install ffmpeg
        run: |
          if ! node scripts/optimize-videos.mjs --check; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - run: pnpm run videos

      # A malformed manifest or a dead screenshot path should fail here rather
      # than be committed and break the deploy.
      - run: pnpm run build

      - name: Commit derivatives
        run: |
          if [ -z "$(git status --porcelain public/img/_opt public/video/_opt)" ]; then
            echo "No derivative changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/_opt public/video/_opt
          git commit -m "chore: rebuild media derivatives"
          git push
