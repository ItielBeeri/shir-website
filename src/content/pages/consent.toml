# באנר ההסכמה למדידה - ערכי רק טקסטים בין הגרשיים.
#
# הבאנר מוצג רק כאשר enabled = true בסעיף [analytics] שב-site.toml, ורק עד
# שהמבקרת בוחרת. הבחירה נשמרת בדפדפן שלה.
#
# שני הכפתורים חייבים להישאר שווים במשקל ובניסוח. הסכמה שהושגה בלחץ, בהטעיה
# או בכפתור סירוב מוחלש אינה הסכמה מדעת, והמדידה כולה נשענת עליה.
#
# body הוא השכבה הראשונה של הגילוי. הפירוט המלא - מה בדיוק נאסף, לכמה זמן,
# ואיך חוזרים מההסכמה - נמצא במדיניות הפרטיות שמקושרת כאן.
#
# המשפט על העברת המידע אל מחוץ לישראל אינו קישוט ואינו ניתן לקיצור: ההיתר
# להעביר את המידע לשרתים בארצות הברית נשען על הסכמת הגולשת להעברה עצמה
# (תקנות העברת מידע אל מאגרי מידע שמחוץ לגבולות המדינה), והלחיצה שמהווה
# את ההסכמה נעשית כאן - לא במדיניות הפרטיות.

[banner]
aria_label = "בקשת הסכמה לשימוש בעוגיות"

title = "עוגיות"

body = "אתר זה משתמש ב-Google Analytics כדי להבין איך גולשים בו ולשפר אותו. לשם כך נשמרות עוגיות בדפדפן, והמידע מועבר לשרתי Google מחוץ לישראל. אפשר לסרב, והאתר יעבוד בדיוק אותו דבר."

accept  = "אישור"
decline = "דחייה"

# הקישור הוא סוף המשפט, כך שאין צורך בטקסט אחריו.
policy_prefix = "לפירוט מה נשמר ולכמה זמן, אפשר לקרוא את"
policy_label  = "מדיניות הפרטיות"
policy_href   = "/terms"

# הכפתור בתחתית כל עמוד, שדרכו אפשר לשנות את הבחירה בדיעבד.
settings_label = "הגדרות פרטיות"
