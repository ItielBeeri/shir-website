# תנאי שימוש ומדיניות פרטיות - ערכי רק טקסטים בין הגרשיים.
#
# המסמך מאחד שני נושאים שהדין מתיר לאחד: תנאי שימוש ומדיניות פרטיות.
# הצהרת הנגישות היא מסמך נפרד (accessibility.toml), כנדרש בתקנה 35.
#
# שים לב: סעיף "מדידה וסטטיסטיקה" כתוב למצב הנוכחי - אין באתר שום כלי
# אנליטיקה. אם מוסיפים Google Analytics או כלי מדידה אחר, חובה לעדכן
# את הסעיף ההוא ולהוסיף מנגנון הסכמה. ראה הערה בגוף הסעיף.

[meta]
title       = "תנאי שימוש ומדיניות פרטיות"
description = "תנאי השימוש באתר שיר אמיתי ומדיניות הפרטיות - מהות המידע באתר, אחריות, קניין רוחני, ואיזה מידע נאסף (ובעיקר: איזה לא)."
updated     = "2026-09-05"
updated_label = "עודכן לאחרונה"

# פסקת הפתיחה של העמוד (שייכת לסעיף [meta] שמעליה)
intro = """
האתר הזה הוא בעיקרו כרטיס ביקור: הוא מספר מי אני, במה אני עוסקת, ואיך אפשר ליצור קשר. אין בו טפסים, אין בו הרשמה, ואין בו חשבונות משתמש.
המסמך שלפניך מסביר את הכללים החלים על השימוש באתר, ומה קורה - ובעיקר, מה לא קורה - עם המידע שלך.
כתבתי אותו בשפה פשוטה ככל שיכולתי. השימוש באתר מהווה הסכמה לתנאים שבו.
"""

# ============================================================
# חלק א' - תנאי שימוש
# ============================================================

[[parts]]
heading = "תנאי שימוש"

[[parts.sections]]
title = "כללי"
body = [
  "אתר זה מופעל על ידי שיר אמיתי (\"בעלת האתר\", \"אני\"), ומספק מידע על שירותי הטיפול שאני מציעה: פסיכותרפיה גופנית בגישת הביוסינתזה, טיפול במגע (שיאצו) ופתיחת קול.",
  "התנאים מנוסחים בלשון נקבה מטעמי נוחות בלבד, ומתייחסים לכל אדם באשר הוא.",
  "השימוש באתר, לרבות עיון בתכניו, מהווה הסכמה לתנאים אלה. מי שאינו מסכים להם מתבקש שלא לעשות שימוש באתר.",
]

[[parts.sections]]
title = "מהות השירות - הבהרה חשובה"
body = [
  "אני מטפלת בגישות משלימות. איני פסיכולוגית, איני פסיכיאטרית, איני עובדת סוציאלית ואיני רופאה. איני מחזיקה ברישיון לפי חוק הפסיכולוגים, התשל\"ז-1977, לפי חוק העובדים הסוציאליים, התשנ\"ו-1996, או לפי חוק הסדרת העיסוק במקצועות הבריאות, התשס\"ח-2008.",
  "הטיפולים שאני מציעה אינם טיפול רפואי, אינם טיפול פסיכולוגי או פסיכיאטרי, ואינם מהווים אבחון, ייעוץ רפואי או תחליף להם.",
  "הטיפולים אינם באים במקום טיפול רפואי, נפשי או תרופתי, ואין להפסיק או לשנות טיפול רפואי או תרופתי כלשהו על סמך מידע שבאתר או על סמך מפגש טיפולי, אלא בהתייעצות עם הרופא או המטפל המוסמך המטפל בך.",
  "התכנים באתר, לרבות פוסטים בבלוג, תיאורי הטיפולים והמלצות המופיעות בו, הם מידע כללי בלבד. אין בהם ייעוץ אישי, אין בהם התחייבות לתוצאה, ואין להסתמך עליהם כתחליף לבדיקה או לייעוץ מקצועי המתאים למצבך.",
]

[[parts.sections]]
title = "מצבי מצוקה וחירום"
body = [
  "האתר אינו מיועד למצבי חירום ואינו ערוץ לפנייה במצוקה דחופה. אני אינני זמינה באופן רציף, ופנייה דרך האתר או דרך פרטי הקשר שבו אינה מבטיחה מענה מיידי.",
  "במצב של סכנה לחיים או מצוקה נפשית חריפה - יש לפנות מיד למגן דוד אדום בטלפון 101, לקו הסיוע של ער\"ן בטלפון 1201, או לחדר מיון בבית החולים הקרוב.",
]

[[parts.sections]]
title = "התאמה אישית וחופש הבחירה"
body = [
  "הטיפולים המתוארים באתר אינם מתאימים לכל אדם ולכל מצב. במפגש היכרות נבחן יחד אם הדרך הזו מתאימה לך, ואם לא - אשמח להפנות למקום מתאים יותר.",
  "אני שומרת לעצמי את הזכות שלא לקבל מטופלת או מטופל לטיפול, מתוך שיקול מקצועי, ובכלל זה כאשר לדעתי נדרש טיפול מסוג אחר.",
]

[[parts.sections]]
title = "המלצות ותכנים של אחרים"
body = [
  "ההמלצות המוצגות באתר הן דברים שנכתבו על ידי מטופלות ומטופלים מרצונם החופשי, ומשקפות את חוויתם האישית בלבד.",
  "חוויה אישית אינה הבטחה. אין בהמלצה כלשהי כדי להעיד על תוצאה שתושג אצל אדם אחר, ואין לראות בהן התחייבות, ערובה או תחזית לגבי תוצאות טיפול.",
  "אדם שהמלצתו מופיעה באתר ומבקש להסירה - מוזמן לפנות אלי, וההמלצה תוסר מיד וללא צורך בנימוק.",
]

[[parts.sections]]
title = "קניין רוחני"
body = [
  "כל הזכויות בתכני האתר - הטקסטים, פוסטי הבלוג, התצלומים, האיורים, העיצוב, מבנה האתר וקוד המקור - שמורות לבעלת האתר או למי שהעניק לה רישיון שימוש, ומוגנות לפי חוק זכות יוצרים, התשס\"ח-2007.",
  "אין להעתיק, לשכפל, להפיץ, לפרסם, לתרגם או לעשות שימוש מסחרי כלשהו בתכני האתר, כולם או חלקם, ללא הסכמה מראש ובכתב.",
  "מותר לצטט קטע קצר מהאתר לצורך הבעת דעה, ביקורת, סקירה או מסירת מידע, בהיקף סביר ובלבד שיצוין שם המקור וכתובת האתר, כמותר לפי דיני השימוש ההוגן.",
]

[[parts.sections]]
title = "קישורים לאתרים אחרים"
body = [
  "האתר כולל קישורים לשירותים ולאתרים חיצוניים, ובהם WhatsApp, פייסבוק ואתר בית הספר לפסיכותרפיה בגישת הביוסינתזה.",
  "אין לי שליטה על אתרים אלה, על תוכנם או על מדיניות הפרטיות שלהם, ואיני אחראית להם. המעבר אליהם ייעשה באחריותך, ובכפוף לתנאי השימוש ולמדיניות הפרטיות שלהם.",
]

[[parts.sections]]
title = "זמינות האתר ושינויים בו"
body = [
  "אני משתדלת שהאתר יהיה זמין ופעיל, אך איני מתחייבת לזמינות רציפה או נטולת תקלות. ייתכנו הפסקות, תקלות טכניות או עבודות תחזוקה.",
  "אני רשאית לשנות את תוכן האתר, את מבנהו ואת השירותים המתוארים בו, וכן להפסיק את פעילותו, בכל עת ולפי שיקול דעתי.",
]

[[parts.sections]]
title = "אחריות"
body = [
  "המידע באתר ניתן כמות שהוא. אני משקיעה מאמץ שהמידע יהיה מדויק ומעודכן, אך איני מתחייבת לכך.",
  "במידה המרבית המותרת לפי דין, לא אשא באחריות לנזק - ישיר או עקיף - שייגרם כתוצאה מהסתמכות על מידע שבאתר, משימוש בו או מאי-יכולת להשתמש בו.",
  "אין באמור בסעיף זה כדי לגרוע מזכות המוקנית לך לפי דין קוגנטי, ובכלל זה לפי חוק הגנת הצרכן, התשמ\"א-1981, ואין בו כדי לפטור מאחריות לנזק גוף או לנזק שנגרם בזדון או ברשלנות רבתי.",
]

[[parts.sections]]
title = "דין וסמכות שיפוט"
body = [
  "על תנאים אלה ועל כל עניין הנובע מהם או מהשימוש באתר יחולו דיני מדינת ישראל בלבד.",
  "סמכות השיפוט נתונה לבתי המשפט המוסמכים בישראל. אין בסעיף זה כדי לגרוע מזכותך, ככל שאת צרכנית, לפנות לבית משפט באזור מגוריך.",
]

# ============================================================
# חלק ב' - מדיניות פרטיות
# ============================================================

[[parts]]
heading = "מדיניות פרטיות"

[[parts.sections]]
title = "העיקר בקצרה"
body = [
  "האתר הזה הוא אתר סטטי. אין בו טפסים, אין בו הרשמה, אין בו חשבונות משתמש, אין בו אזור אישי ואין בו מערכת תגובות.",
  "איני מנהלת מאגר מידע של גולשי האתר, ואיני אוספת דרכו מידע אישי כלשהו עליך - לא את שמך, לא את כתובת הדוא\"ל שלך ולא את מספר הטלפון שלך.",
  "אין באתר כלי מדידה ואין בו עוגיות מעקב מכל סוג.",
]

[[parts.sections]]
title = "מה כן נשמר - ולמה"
body = [
  "שני דברים בלבד:",
]
items = [
  "רישומי שרת (לוגים). האתר מאוחסן אצל ספק אחסון, וכמו כל שרת אינטרנט הוא רושם באופן טכני את כתובת ה-IP של המבקר, את סוג הדפדפן ואת העמוד שנצפה. כתובת IP עשויה להיחשב מידע אישי לפי חוק הגנת הפרטיות. רישומים אלה נועדו לאבטחת השרת ולתפעולו, נשמרים לתקופה קצרה בלבד אצל הספק, ואיני עושה בהם כל שימוש ואיני מצליבה אותם עם מידע אחר.",
  "העדפת אנימציות. אם תבחרי לעצור את האנימציות באתר, הבחירה נשמרת בדפדפן שלך כדי שנזכור אותה בביקור הבא. היא נשארת במכשיר שלך ואינה מגיעה אלי.",
]

[[parts.sections]]
title = "כשאת פונה אלי"
body = [
  "פרטי הקשר באתר הם קישורים ישירים - ל-WhatsApp, לחיוג טלפוני ולדוא\"ל. הם אינם טפסים, והם אינם שולחים אלי דבר מעצמם.",
  "פנייה דרכם מתבצעת באפליקציה או בשירות שבחרת, וכפופה למדיניות הפרטיות של אותו שירות. אם פנית ל-WhatsApp - התכתובת מתנהלת בשרתי WhatsApp; אם שלחת דוא\"ל - ההודעה מגיעה לתיבת הדוא\"ל שלי.",
  "המידע שתמסרי לי בפנייה כזו ישמש אך ורק כדי לחזור אליך ולתאם. איני מעבירה אותו לצד שלישי, איני משתמשת בו לדיוור פרסומי, ואיני מוסיפה אותך לרשימת תפוצה כלשהי.",
  "מידע הנמסר במסגרת טיפול נשמר בסודיות מקצועית, ואינו קשור לאתר זה או נשמר בו.",
]

[[parts.sections]]
title = "מדידה וסטטיסטיקה"
# PLACEHOLDER: TXT_PRIVACY_ANALYTICS
# נכון לעכשיו אין באתר שום כלי מדידה, והסעיף מנוסח בהתאם.
# אם וכאשר מוסיפים Google Analytics או כלי מדידה אחר - אסור להסתפק
# בעדכון הטקסט כאן. לפי עמדת הרשות להגנת הפרטיות (גילוי דעת בנושא
# הסכמה, פברואר 2026) ובעקבות תיקון 13 לחוק, נדרשת הסכמת opt-in
# אקטיבית לפני טעינת הכלי, וכן פירוט מלא של הכלי, מטרת האיסוף,
# משך השמירה והעברת המידע לחו"ל.
body = [
  "נכון למועד עדכון מדיניות זו, אין באתר Google Analytics ואין בו כלי מדידה, ניתוח או פרסום אחר.",
  "אם ייווסף בעתיד כלי כזה, מדיניות זו תעודכן מראש, ותוצג בקשת הסכמה נפרדת לפני הפעלתו. כלי מדידה לא יופעל בלי הסכמתך המפורשת.",
]

[[parts.sections]]
title = "הזכויות שלך"
body = [
  "מכיוון שאיני מנהלת מאגר מידע של גולשי האתר, אין בידיי מידע אישי עליך שניתן לעיין בו או לתקנו.",
  "אם בכל זאת מצוי בידיי מידע אישי עליך - למשל בעקבות פנייה ששלחת אלי - עומדות לך הזכויות שמקנה חוק הגנת הפרטיות, התשמ\"א-1981: הזכות לדעת אם מוחזק לגביך מידע, הזכות לעיין בו, והזכות לבקש את תיקונו או את מחיקתו. כל שנדרש הוא לפנות אלי, ואטפל בבקשה.",
]

[[parts.sections]]
title = "אבטחת מידע"
body = [
  "האתר מוגש בתקשורת מוצפנת (HTTPS). מכיוון שהוא סטטי ואינו אוסף מידע, משטח החשיפה שלו קטן במיוחד.",
  "עם זאת, אין מערכת מקוונת חסינה לחלוטין, ואיני יכולה להתחייב לחסינות מוחלטת מפני גישה בלתי מורשית.",
]

[[parts.sections]]
title = "קטינים"
body = [
  "האתר אינו מיועד לילדים ואינו פונה אליהם, ואינו אוסף מידע ביודעין מקטינים.",
  "טיפול בקטין מותנה בהסכמת שני ההורים או האפוטרופוס החוקי.",
]

[[parts.sections]]
title = "שינויים במדיניות"
body = [
  "מדיניות זו עשויה להתעדכן מעת לעת, למשל אם ייווספו לאתר יכולות חדשות או אם ישתנה הדין.",
  "תאריך העדכון האחרון מופיע בראש העמוד. שינוי מהותי - ובפרט הוספת כלי מדידה או איסוף מידע - ילווה בהודעה באתר ובבקשת הסכמה, ולא ייכנס לתוקף בשתיקה.",
]

[[parts.sections]]
title = "יצירת קשר בנושא פרטיות"
body = [
  "בכל שאלה, בקשה או תלונה בנוגע לפרטיות או לתנאי השימוש - אפשר לפנות אלי ישירות, בכל אחת מדרכי ההתקשרות המופיעות בעמוד יצירת הקשר. אשיב בהקדם.",
]
