# הצהרת נגישות - ערכי רק טקסטים בין הגרשיים.
#
# מסמך זה נדרש לפי תקנה 35 לתקנות שוויון זכויות לאנשים עם מוגבלות
# (התאמות נגישות לשירות), התשע"ג-2013.
#
# חשוב: הצהרת נגישות חייבת לשקף את המצב בפועל. אם משנים משהו באתר
# שמשפיע על הנגישות - יש לעדכן גם את התאריך בשדה updated למטה.

[meta]
title       = "הצהרת נגישות"
description = "הצהרת הנגישות של אתר שיר אמיתי - רמת הנגישות, ההתאמות שבוצעו, מגבלות ידועות ודרכי פנייה בנושאי נגישות."
updated     = "2026-09-05"
updated_label = "עודכן לאחרונה"

[[sections]]
title = "המחויבות שלי"
body = [
  "אני רואה בנגישות האתר חלק מהותי מהדרך שבה אני מבקשת לפגוש אנשים - בכבוד, בשוויון ובלי מכשולים מיותרים. אני פועלת כדי שכל אדם, לרבות אנשים עם מוגבלות, יוכל לגלוש באתר ולקבל את המידע שבו באופן עצמאי, נוח ומכבד.",
  "ההתאמות באתר בוצעו מתוך רצון לעמוד במלוא הוראות חוק שוויון זכויות לאנשים עם מוגבלות, התשנ\"ח-1998, ותקנות שוויון זכויות לאנשים עם מוגבלות (התאמות נגישות לשירות), התשע\"ג-2013.",
]

[[sections]]
title = "רמת הנגישות והתקן שלפיו הונגש האתר"
body = [
  "האתר הונגש בהתאם לתקן הישראלי ת\"י 5568 חלק 1 - \"קווים מנחים לנגישות תכנים באינטרנט\", ברמת נגישות AA, כנדרש בתקנה 35 לתקנות הנגישות לשירות.",
]

[[sections]]
title = "ההתאמות שבוצעו באתר"
body = [
  "בין ההתאמות שיושמו באתר:",
]
items = [
  "אפשר לנווט בכל האתר במקלדת בלבד, והמקום שבו נמצא הסמן מסומן בבירור.",
  "בראש כל עמוד יש קישור \"דלג לתוכן\", המדלג על תפריט הניווט.",
  "מבנה הכותרות מסודר, כך שתוכנות הקראת מסך יכולות לנוע בין חלקי העמוד.",
  "לכל תמונה הנושאת מידע יש תיאור בעברית, ותמונות שהן קישוט בלבד מסומנות ככאלה ומדולגות.",
  "ניגודיות הצבעים בין הטקסט לרקע עומדת בדרישות התקן.",
  "אפשר להגדיל את הטקסט בלי שיאבד מידע ובלי שהעמוד יישבר.",
  "בתחתית כל עמוד יש כפתור לעצירת האנימציות באתר. הבחירה נשמרת לביקורים הבאים.",
  "אם הגדרת במכשיר שלך העדפה להפחתת תנועה, האתר מזהה אותה ומצמצם אנימציות מעצמו.",
  "לצד כל המלצה המוצגת כתמונה מופיע תמליל טקסט מלא, שאפשר לפתוח, להגדיל ולהקריא.",
  "האתר כתוב בעברית ובנוי מימין לשמאל, כך שתוכנות הקראה מבטאות אותו נכון.",
]

[[sections]]
title = "כיצד נבדקה הנגישות"
# PLACEHOLDER: TXT_A11Y_TESTING
# הסעיף מתאר אך ורק בדיקות שבוצעו בפועל. אין להוסיף כאן דפדפן או תוכנת
# הקראה שלא נבדקו באמת - הצהרה על בדיקה שלא נעשתה גרועה מהיעדר הצהרה.
# לאחר בדיקה עם NVDA או VoiceOver, אפשר להוסיף אותה לרשימה ולעדכן את התאריך.
body = [
  "האתר נבדק בבדיקה ידנית ובבדיקת קוד: מבנה העמודים, התיאורים הטקסטואליים של התמונות, ההפעלה במקלדת, וניגודיות הצבעים בין הטקסט לרקע.",
  "הבדיקה נערכה בדפדפן עדכני. בדיקה משלימה עם תוכנת הקראת מסך טרם בוצעה.",
]

[[sections]]
title = "מגבלות ידועות"
body = [
  "ההמלצות מוצגות כצילומי מסך של ההודעות שנשלחו אלי. לצד כל צילום מופיע תמליל טקסט מלא של ההמלצה, כך שהתוכן זמין במלואו גם למי שאינו יכול לקרוא את הצילום.",
  "ייתכן שבחלקים מסוימים באתר, ובעיקר בתכנים חדשים שנוספים לבלוג, תתגלה בעיית נגישות שטרם אותרה. אני מתחייבת לטפל בכל פנייה בנושא בהקדם.",
  "לאתר זה לא ניתן פטור כלשהו מהוראות תקנות הנגישות.",
]

[[sections]]
title = "נגישות הקליניקה והשירות הפיזי"
# PLACEHOLDER: TXT_A11Y_PHYSICAL
# חובה למלא את הפרטים האמיתיים של המרחב הטיפולי לפני העלאה לאוויר.
# תיאור לא מדויק של נגישות פיזית חושף לתביעה בדיוק כמו היעדר נגישות.
# יש לתאר בכנות: האם יש מדרגות בכניסה? כמה? האם יש חניית נכים בסביבה?
# האם השירותים נגישים? מהו רוחב הפתחים? האם יש מעלית או מעלון?
body = [
  "כאן יש לתאר במדויק את נגישות המרחב הטיפולי בפרדס חנה: דרך הגישה והכניסה, מדרגות אם ישנן, חניה, שירותים ורוחב מעברים.",
  "בנוסף לפגישות בקליניקה, ניתן לקיים פגישות בזום. עבור חלק מהאנשים זו התאמה מלאה ונוחה יותר, ואני מזמינה לפנות ולתאם כך.",
  "אני מזמינה כל אדם שזקוק להתאמה כדי להגיע או לקבל טיפול לפנות אלי מראש, ונמצא יחד את הדרך.",
]

[[sections]]
title = "פניות בנושא נגישות"
body = [
  "אם נתקלת באתר בבעיית נגישות, אם משהו לא עבד כפי שציפית, או אם יש לך הצעה לשיפור - אשמח מאוד לשמוע. פנייה כזו היא עזרה אמיתית, לי ולמי שיגיע אחריך.",
  "בפנייה מועיל לציין את כתובת העמוד, תיאור קצר של הבעיה, וסוג המכשיר, הדפדפן וטכנולוגיית הסיוע שבהם השתמשת. אשיב לכל פנייה בהקדם האפשרי.",
]

[[sections]]
title = "אחראית הנגישות"
body = [
  "האחראית על הנגישות מטעם העסק היא שיר אמיתי, בעלת העסק, ופניות בנושאי נגישות מטופלות על ידה באופן אישי.",
  "העסק מעסיק פחות מ-25 עובדים, ולפיכך אינו חייב במינוי רכז נגישות לפי סעיף 19עא לחוק שוויון זכויות לאנשים עם מוגבלות.",
  "דרכי ההתקשרות מופיעות מיד לאחר סעיף זה.",
]
