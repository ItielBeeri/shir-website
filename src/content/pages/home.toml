# דף הבית — ערכי רק טקסטים בין הגרשיים

[hero]
title      = "שיר אמיתי"
tagline    = "פסיכותרפיה · טיפול במגע · פתיחת קול"
descriptor = "מרחב לטיפול בגוף, נפש וקול"
subtitle   = "קול הנשמה - מרחב לגילוי הביטוי העמוק שלך"
scroll_cue = "גלילה"

[intro]
portrait   = "placeholder-portrait"
cta_label  = "להמשיך לקרוא "
cta_href   = "/about"
paragraph_1 = """
היי, אני שיר אמיתי. אני מלווה אנשים בחיבור לבהירות עמוקה בתוכם, ולאומץ וכוחות לבטא אותה בעולם.
מטפלת בפסיכותרפיה גופנית, ומוזיקאית יוצרת.
התחומים האלה שלובים מאוד עבורי, ועבור מי שאני מלווה -
אנחנו מבקשים למצוא את הקול האמיתי שלנו, ולבטא אותו בכל המובנים, התחומים והיחסים.
"""
paragraph_2 = """
אפשר לפגוש אותי בצורות שונות, לפי מה שמתאים לך:
בשיחה, בשילוב של קונסטלציה משפחתית,
בטיפול במגע סומטי - מבוסס שיאצו, 
ובמפגשים לפתיחת הקול.
אפשר להגיע לסוג מפגשים מסויים בלבד, ואפשר שישתלבו בתהליך רחב וכולל. 
"""

